# 소개 사이트(개인정보 처리방침·약관·계정 삭제 안내·휴대폰 캐릭터 그림 묶음) → GitHub Pages
# 주소: https://kysk2295.github.io/sprout/ (2026-11-02 Railway가 꺼져 옮김 — site/scripts/pages.mjs)
name: site-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/release/legal/**'
      - 'packages/schema/art3d/**'
      - 'scripts/brand/**'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

# Pages 출처는 gh-pages 브랜치(/) — 결과물을 그 브랜치에 강제로 올리면 GitHub가 배포한다.
# Actions가 막혔을 때는 이 맥에서 site/scripts/publish-gh-pages.sh로 같은 일을 한다.
permissions:
  contents: write

concurrency:
  group: site-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 의존성 없음 — build.mjs가 법률 문서(docs/release/legal)와 캐릭터 그림(packages/schema/art3d)을 직접 읽는다
      - run: site/scripts/publish-gh-pages.sh
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
