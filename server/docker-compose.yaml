# sprout 백엔드 — Mac mini(또는 Railway·VPS)에서 그대로 쓴다.
#   db        Postgres 18 (wal_level=logical). 데이터 DB + PowerSync 저장 DB(powersync_storage)
#   powersync PowerSync Service Open Edition — 사용자별 변경분을 기기로 스트리밍
#   api       Node API — 이메일 로그인·JWT(JWKS)·업로드·AI 프록시(→ 호스트 Ollama)·FCM 푸시(스케줄러 포함, 새 컨테이너 없음)
#   backup    매일 pg_dump, 14일 보관 (외부 저장소 전송은 배포 때 붙인다)
# 처음: ./scripts/init-env.sh 로 .env를 만든 뒤 docker compose up -d
name: sprout

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432" # 디버깅용, 이 컴퓨터에서만
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      API_PORT: 6060
      API_ISSUER: sprout-api
      KEYS_PATH: /data/keys.json
      # AI 프록시(README "AI 프록시"). Ollama는 인터넷에 열지 않는다. 상한 숫자는 [임시]
      # AI_BACKEND: direct(OLLAMA_URL로 바로) | worker(Mac mini 워커가 당겨 감, Railway 배포용). 비우면 AI_WORKER_TOKEN 있으면 worker
      AI_BACKEND: ${AI_BACKEND:-}
      AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434} # direct일 때. host.docker.internal = 로컬 개발용
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b}
      AI_MODELS: ${AI_MODELS:-}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      AI_QUEUE_MAX: ${AI_QUEUE_MAX:-20}
      AI_QUEUE_WAIT_MS: ${AI_QUEUE_WAIT_MS:-180000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
      AI_USER_CONCURRENT: ${AI_USER_CONCURRENT:-2}
      AI_USER_PER_MINUTE: ${AI_USER_PER_MINUTE:-6}
      AI_USER_PER_DAY: ${AI_USER_PER_DAY:-100}
      AI_WEEKLY_KPI_DRAFT: ${AI_WEEKLY_KPI_DRAFT:-1}
      AI_WEEKLY_REPORT: ${AI_WEEKLY_REPORT:-1}
      # 로그인 시도 제한(08 §4): 도커 안에서는 Funnel·게이트웨이가 사설 IP로 보여 X-Forwarded-For를 믿는다
      TRUST_PROXY: ${TRUST_PROXY:-private}
      # 소셜 로그인(08 §3.1, README "소셜 로그인"). 비우면 그 버튼만 "준비 중"
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:+/run/secrets/apple.p8}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://macmini.tail425c97.ts.net}
      # 푸시 알림(32, README "푸시 알림"). FCM_PROJECT_ID가 비면 푸시 전체가 꺼지고 앱은 로컬 알림만 쓴다
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:+/run/secrets/fcm.json}
      FCM_SERVICE_ACCOUNT_B64: ${FCM_SERVICE_ACCOUNT_B64:-}
      PUSH_TICK_MS: ${PUSH_TICK_MS:-30000}
      PUSH_SYNC_MIN_SEC: ${PUSH_SYNC_MIN_SEC:-30}
      PUSH_IOS: ${PUSH_IOS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway" # 리눅스(VPS)에서도 호스트의 Ollama에 닿게. Docker Desktop(Mac)은 원래 된다
    volumes:
      - api_data:/data
      - ${APPLE_PRIVATE_KEY:-/dev/null}:/run/secrets/apple.p8:ro # 애플 .p8(있을 때만)
      - ${FCM_SERVICE_ACCOUNT:-/dev/null}:/run/secrets/fcm.json:ro # FCM 서비스 계정 키(있을 때만)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-6060}:6060"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6060/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/powersync_storage
      PS_JWKS_URL: http://api:6060/.well-known/jwks.json
      PS_PORT: 8080
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN}
    volumes:
      - ./powersync:/config:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PS_PORT:-8080}:8080"

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
    entrypoint: ["sh", "/backup/run.sh"]
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  api_data:
