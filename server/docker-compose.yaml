# sprout 백엔드 — Mac mini(또는 Railway·VPS)에서 그대로 쓴다.
#   db        Postgres 18 (wal_level=logical). 데이터 DB + PowerSync 저장 DB(powersync_storage)
#   powersync PowerSync Service Open Edition — 사용자별 변경분을 기기로 스트리밍
#   api       Node API — 이메일 로그인·JWT(JWKS)·업로드
#   backup    매일 pg_dump, 14일 보관 (외부 저장소 전송은 배포 때 붙인다)
# 처음: ./scripts/init-env.sh 로 .env를 만든 뒤 docker compose up -d
name: sprout

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432" # 디버깅용, 이 컴퓨터에서만
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      API_PORT: 6060
      API_ISSUER: sprout-api
      KEYS_PATH: /data/keys.json
    volumes:
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-6060}:6060"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6060/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/powersync_storage
      PS_JWKS_URL: http://api:6060/.well-known/jwks.json
      PS_PORT: 8080
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN}
    volumes:
      - ./powersync:/config:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PS_PORT:-8080}:8080"

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
    entrypoint: ["sh", "/backup/run.sh"]
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  api_data:
