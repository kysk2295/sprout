# sprout 데스크톱 패키징 설정 (electron-builder). 설명: docs/release/packaging.md
# 번들 ID는 여기 한 곳에서만 정한다. 위젯 확장(WidgetKit)은 app.sprout.desktop.widget 처럼 이 ID를 접두로 쓴다.
appId: app.sprout.desktop
# 제품명 꿈틀(Kkumteul, 2026-10-05 확정). productName은 파일 이름(Kkumteul.app·Kkumteul Helper·Kkumteul.exe)이라 영문으로 둔다 —
# 한글 productName(꿈틀.app)이나 Info.plist CFBundleName=꿈틀로 패키징하면 Electron이 시작하자마자 SIGTRAP으로 죽는다(2026-10-05 직접 확인).
# 화면에 보이는 이름 꿈틀은 아래 mac.extendInfo(CFBundleDisplayName) + after-pack.cjs의 ko/en.lproj InfoPlist.strings
# (Finder·Launchpad·Dock·메뉴 막대), dmg.title, nsis 바로 가기 이름, src/main/brand.ts(창 제목·메뉴·정보 창·트레이)로 정한다.
productName: Kkumteul
copyright: Copyright © 2026 유니포트

# 실행 중 앱 이름(app.name)은 내부 이름 sprout 그대로 둔다 — 위 productName과 일부러 다르다.
# app.name이 바뀌면 ① 데이터 폴더 ~/Library/Application Support/sprout 가 새 폴더로 바뀌어 로그아웃·DB 초기화되고
# ② safeStorage 키체인 항목("sprout Safe Storage")이 바뀌어 저장해 둔 토큰을 못 푼다. 그래서 package.json의 productName만 sprout.
# (개발 실행은 package.json name 그대로라 @sprout/desktop — 서로 안 섞임. src/main/profile.ts가 폴더를 한 번 더 고정)
extraMetadata:
  productName: sprout

directories:
  output: release
  buildResources: build

# electron-vite 결과물(out/)만 넣는다. 렌더러 라이브러리는 번들에 들어가 있어 node_modules에는
# 실행 시 필요한 것(@powersync/node + 의존성, better-sqlite3)만 들어간다(package.json dependencies).
files:
  - out/**
  - package.json
  # 다른 플랫폼용 네이티브 바이너리는 뺀다(플랫폼별 제외는 아래 mac.files·win.files — 위쪽 목록과 합쳐진다)
  - "!**/node_modules/@powersync/node/lib/*.linux.so"
  - "!**/node_modules/@powersync/node/src/**"
  - "!**/node_modules/@powersync/node/lib/**/*.map"
  - "!**/node_modules/better-sqlite3/prebuilds/{linux,linuxmusl}-*.node"
  - "!**/node_modules/better-sqlite3/{src,deps}/**"

# asar를 끈다: @powersync/node의 기본 워커가 import.meta.url 기준으로 확장(.dylib)을 sqlite loadExtension(dlopen)으로
# 여는데, asar 안 경로는 실제 파일이 아니라 로드에 실패한다(asarUnpack만으로는 경로가 app.asar를 가리킨 채 남음).
# 스파이크(A1)처럼 커스텀 워커로 경로를 app.asar.unpacked로 바꾸면 asar를 다시 켤 수 있다 — packaging.md "알려진 문제" 참고.
asar: false

# better-sqlite3 13은 Node-API 프리빌드(prebuilds/darwin-*.node)를 써서 Electron용 재빌드가 필요 없다.
npmRebuild: false

# 트레이 아이콘(src/main/mini.ts가 process.resourcesPath에서 읽음)
extraResources:
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: resources/trayTemplate@3x.png
    to: trayTemplate@3x.png
  # Windows 트레이(템플릿 이미지가 없어 색 있는 .ico를 쓴다 — mini.ts가 win32에서 읽음)
  - from: resources/tray.ico
    to: tray.ico

protocols:
  - name: sprout
    schemes:
      - sprout

afterPack: build/after-pack.cjs

mac:
  category: public.app-category.productivity
  # 제외만 적으면 electron-builder가 "**/*"를 앞에 붙여 앱 폴더 전체(node_modules/electron의 Electron.app까지)를 넣다가
  # 심볼릭 링크에서 ENOENT로 깨진다(2026-10-05 확인) → 위쪽과 같은 포함 패턴을 다시 적는다
  files:
    - out/**
    - package.json
    - "!**/node_modules/@powersync/node/lib/*.dll"
    - "!**/node_modules/better-sqlite3/prebuilds/win32-*.node"
  extraResources:
    # 16 §11.4 Apple 캘린더 도우미(EventKit). 먼저 npm run calendar:build(arm64·x64 유니버설) — 없으면 건너뛰고 앱은 "도우미가 없어요"로 표시
    - from: native/calendar/out
      to: .
      filter:
        - sprout-calendar
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  minimumSystemVersion: "12.0"
  # Electron UI 문자열 언어(.lproj) — 쓰는 것만 남겨 크기를 줄인다
  electronLanguages: [ko, en]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 위젯 확장은 afterPack에서 자기 entitlements로 먼저 서명한다 — Electron 쪽 서명으로 덮지 않게 건너뜀
  signIgnore:
    - "Contents/PlugIns/.*\\.appex"
  # 공증은 환경 변수(APPLE_API_KEY…/APPLE_ID…/APPLE_KEYCHAIN_PROFILE)가 있을 때만 electron-builder가 자동 수행
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 유니포트
    # CFBundleName(Info.plist 원본)은 영문 productName 그대로 둔다 — 한글로 바꾸면 Electron이 시작 직후 SIGTRAP(2026-10-05 확인).
    # 메뉴 막대·Finder의 한글 이름은 after-pack.cjs가 넣는 ko/en.lproj InfoPlist.strings의 CFBundleName·CFBundleDisplayName이 맡는다.
    # Finder는 이 기본값이 파일 이름(Kkumteul.app)과 같을 때만 lproj의 현지화 이름(꿈틀)을 보여 준다(2026-10-05 확인)
    CFBundleDisplayName: Kkumteul
    LSHasLocalizedDisplayName: true
    LSApplicationCategoryType: public.app-category.productivity
    # 16 §11.4 Apple 캘린더 읽기 권한 창 문구(권한은 책임 프로세스인 앱 이름으로 묻는다)
    NSCalendarsFullAccessUsageDescription: 꿈틀이 맥 캘린더 앱의 일정을 할 일과 함께 보여 주고, 꿈틀에서 만들거나 고친 일정을 캘린더 앱에도 저장해요.
    NSCalendarsUsageDescription: 꿈틀이 맥 캘린더 앱의 일정을 할 일과 함께 보여 주고, 꿈틀에서 만들거나 고친 일정을 캘린더 앱에도 저장해요.

# Windows 대상을 만들 때 쓰는 앱 아이콘(로고 B, docs/release/brand/out/b)
win:
  icon: build/icon.ico
  # 맥 전용 바이너리(PowerSync .dylib, better-sqlite3 darwin 프리빌드)는 Windows 설치 파일에서 뺀다
  files:
    - out/**
    - package.json
    - "!**/node_modules/@powersync/node/lib/*.dylib"
    - "!**/node_modules/better-sqlite3/prebuilds/darwin-*.node"

# 예: Kkumteul-0.0.1-arm64.dmg, Kkumteul-0.0.1-arm64.zip (zip은 자동 업데이트용으로 남겨 둠). 내려받는 파일 이름은 영문(꿈틀 = Kkumteul)
artifactName: Kkumteul-${version}-${arch}.${ext}

# dmg를 열었을 때 볼륨 이름
dmg:
  title: 꿈틀 ${version}

# Windows 설치 프로그램·시작 메뉴·바탕 화면 바로 가기·프로그램 추가/제거 이름
nsis:
  shortcutName: 꿈틀
  uninstallDisplayName: 꿈틀 ${version}
