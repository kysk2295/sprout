// 32 §17.6 결정: 정확한 알람(Android 12+ "알람 및 리마인더") 확인·설정 열기 — 앱 안 작은 Expo 모듈(modules/ 자동 링크)
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sprout'
version = '0.1.0'

android {
  namespace "app.sprout.alarms"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
